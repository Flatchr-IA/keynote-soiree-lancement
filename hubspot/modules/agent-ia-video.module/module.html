<section class="aia-video-sec" id="vision">
  <div class="aia-wrap">
    <div class="aia-head">
      {% if module.eyebrow %}<p class="aia-eyebrow">{{ module.eyebrow }}</p>{% endif %}
      <h2 class="aia-h2">{{ module.title }}</h2>
      {% if module.subtitle %}<p class="aia-sub">{{ module.subtitle }}</p>{% endif %}
    </div>
    <div class="aia-video" data-url="{{ module.video_url|escape }}">
      <div class="aia-video-ph"><span class="aia-play" aria-hidden="true"></span><p><strong>{{ module.placeholder_title }}</strong><br>{{ module.placeholder_text }}</p></div>
    </div>
  </div>
</section>
